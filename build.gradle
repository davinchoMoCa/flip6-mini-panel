plugins { id 'com.android.application' version '9.3.1' }
android {
 namespace 'local.flip6.minipanel'
 compileSdk 36
 defaultConfig { applicationId 'local.flip6.minipanel'; minSdk 31; targetSdk 35; versionCode 5; versionName '0.5-gestures' }
 sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs=['src']; res.srcDirs=['res'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
 // Optional private signing configuration; never commit a keystore.
 signingConfigs {
  if (System.getenv('MINIPANEL_KEYSTORE_PATH')) {
   distribution {
    storeFile file(System.getenv('MINIPANEL_KEYSTORE_PATH'))
    storePassword System.getenv('MINIPANEL_KEYSTORE_PASSWORD')
    keyAlias System.getenv('MINIPANEL_KEY_ALIAS')
    keyPassword System.getenv('MINIPANEL_KEY_PASSWORD')
   }
  }
 }
 buildTypes {
  debug { if (System.getenv('MINIPANEL_KEYSTORE_PATH')) signingConfig signingConfigs.distribution }
  release { minifyEnabled false; if (System.getenv('MINIPANEL_KEYSTORE_PATH')) signingConfig signingConfigs.distribution }
 }
}
dependencies { implementation 'com.google.android.material:material:1.13.0' }
